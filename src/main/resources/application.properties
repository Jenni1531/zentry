spring.application.name=api

# Carga variables desde .env en la raíz del proyecto (si existe). No falla si no está presente.
spring.config.import=optional:file:.env[.properties]

# --- BASE DE DATOS (PostgreSQL / NeonDB) ---
# Configurar via variables de entorno; los valores por defecto solo sirven para desarrollo local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zentry_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
# Imprimir cada SQL ralentiza mucho el servidor: activar solo para depurar (JPA_SHOW_SQL=true)
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# Carga colecciones/relaciones perezosas en lotes (evita N+1: herramientas de obras, tareas de proyectos...)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Pool de conexiones afinado para NeonDB (la base es remota: reutilizar conexiones es clave)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000
# Mantiene vivas las conexiones ociosas para que Neon no las cierre (evita reconexiones lentas)
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS zentry_core; CREATE SCHEMA IF NOT EXISTS zentry_business; CREATE SCHEMA IF NOT EXISTS zentry_ai; CREATE SCHEMA IF NOT EXISTS zentry_analytics; CREATE SCHEMA IF NOT EXISTS zentry_realtime;


# --- SWAGGER / OPENAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- RENDIMIENTO HTTP ---
# Comprime respuestas JSON grandes (feed, explorar, perfiles)
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/html,application/javascript,text/css
server.compression.min-response-size=2048

# --- PROXY / DEV TUNNELS ---
server.forward-headers-strategy=framework

# CONFIGURACIÓN DE SEGURIDAD - JWT
# Obligatorio configurar JWT_SECRET via variable de entorno en cualquier entorno compartido/productivo.
# El valor por defecto es solo para desarrollo local y NO debe usarse en producción.
security.jwt.secret-key=${JWT_SECRET}

# Tiempo de expiración del token en milisegundos
# 86400000 ms = 1 día
security.jwt.expiration-time=${JWT_EXPIRATION_MS:86400000}

# Aumentar el tamaño máximo por archivo a 150MB (permite videos y archivos pesados)
spring.servlet.multipart.max-file-size=150MB
# Aumentar el tamaño máximo de toda la petición
spring.servlet.multipart.max-request-size=150MB
server.tomcat.max-swallow-size=150MB
server.tomcat.max-http-form-post-size=150MB

#Google
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true