spring.application.name=api

# --- CONFIGURACIÓN NEONDB (POSTGRESQL) ---
#spring.datasource.url=jdbc:postgresql://ep-dry-band-akpv9vsu-pooler.c-3.us-west-2.aws.neon.tech/neondb?user=neondb_owner&password=***REMOVED***&sslmode=require&channelBinding=require
#spring.datasource.username=neondb_owner
#spring.datasource.password=***REMOVED***
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#--- PG Local ---
spring.datasource.url=jdbc:postgresql://localhost:5432/zentry_db
spring.datasource.username=postgres
spring.datasource.password=postgres


# --- SWAGGER / OPENAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- PROXY / DEV TUNNELS ---
server.forward-headers-strategy=framework

# CONFIGURACIÓN DE SEGURIDAD - JWT
# Cambiar En producción poruna variable de entorno
security.jwt.secret-key=***REMOVED***

# Tiempo de expiración del token en milisegundos
# 86400000 ms = 1 día
security.jwt.expiration-time=86400000

# Aumentar el tamaño máximo por archivo a 10MB
spring.servlet.multipart.max-file-size=10MB
# Aumentar el tamaño máximo de toda la petición
spring.servlet.multipart.max-request-size=20MB
